name: Build and Push Container

'on':
  push:
    branches:
      - 'task/csp-cloud-build-integration'
      - 'cloud-build/*'
  workflow_dispatch:
    inputs:
      run_tests:
        description: 'Run automated tests before container build (true/false)'
        required: false
        default: 'true'
        type: string

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Cloud Unit Tests & Checks
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.run_tests != 'false' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Run web type-check
        working-directory: web
        run: npm run type-check

      - name: Run web unit tests
        working-directory: web
        run: npm test

      - name: Build frontend static bundle
        working-directory: web
        run: npm run build

      - name: Copy built assets to webassets
        run: cp -r web/dist/* internal/webassets/dist/

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Verify Go dependencies
        run: go mod verify

      - name: Run Go vet
        run: go vet -tags "with_quic with_wireguard" ./...

      - name: Run Go tests
        run: go test -v -tags "with_quic with_wireguard" ./...

  build:
    name: Build and Push to GHCR
    runs-on: ubuntu-latest
    needs: [test]
    if: ${{ always() && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        run: |
          COMMIT_SHA="${{ github.sha }}"
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          IMAGE_NAME="ghcr.io/einck0/clash-sub-parser"
          PRIMARY_TAG="${IMAGE_NAME}:sha-${COMMIT_SHA}"
          RUN_TAG="${IMAGE_NAME}:run-${{ github.run_id }}"
          echo "commit_sha=${COMMIT_SHA}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "primary_tag=${PRIMARY_TAG}" >> "$GITHUB_OUTPUT"
          echo "run_tag=${RUN_TAG}" >> "$GITHUB_OUTPUT"
          echo "tags=${PRIMARY_TAG},${RUN_TAG}" >> "$GITHUB_OUTPUT"

      - name: Build container image and load into Docker daemon
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            GOPROXY=https://proxy.golang.org,direct
            NPM_CONFIG_REGISTRY=https://registry.npmjs.org
            ALPINE_MIRROR=

      - name: Save container image tarball
        run: |
          docker save -o /tmp/csp-container.tar "${{ steps.meta.outputs.primary_tag }}"

      - name: Upload container image artifact
        uses: actions/upload-artifact@v4
        with:
          name: csp-container-image
          path: /tmp/csp-container.tar
          retention-days: 7

      - name: Push image to GHCR
        id: push-ghcr
        continue-on-error: true
        run: |
          echo "Attempting to push tags to GHCR..."
          IMAGE_NAME="ghcr.io/einck0/clash-sub-parser"
          RUN_TAG="${{ steps.meta.outputs.run_tag }}"
          PRIMARY_TAG="${{ steps.meta.outputs.primary_tag }}"
          
          if docker push "$PRIMARY_TAG" && docker push "$RUN_TAG"; then
            DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$PRIMARY_TAG" 2>/dev/null || echo "")
            echo "push_status=success" >> "$GITHUB_OUTPUT"
            echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
            echo "GHCR push succeeded. Digest: ${DIGEST}"
          else
            echo "push_status=failed_or_unauthorized" >> "$GITHUB_OUTPUT"
            echo "digest=" >> "$GITHUB_OUTPUT"
            echo "::warning::Pushing to GHCR failed (permissions or quota restriction). The container image has been safely uploaded as workflow artifact 'csp-container-image'."
          fi

      - name: Output verification summary
        run: |
          echo "===================================================="
          echo "Cloud Container Build Summary"
          echo "Triggered Ref: ${{ github.ref }}"
          echo "Commit SHA: ${{ steps.meta.outputs.commit_sha }}"
          echo "Short SHA: ${{ steps.meta.outputs.short_sha }}"
          echo "Primary Tag: ${{ steps.meta.outputs.primary_tag }}"
          echo "Artifact Uploaded: csp-container-image (/tmp/csp-container.tar)"
          echo "GHCR Push Status: ${{ steps.push-ghcr.outputs.push_status }}"
          if [ -n "${{ steps.push-ghcr.outputs.digest }}" ]; then
            echo "GHCR Image Digest: ${{ steps.push-ghcr.outputs.digest }}"
          else
            echo "GHCR Image Digest: Unavailable (Preserved via Actions Artifact)"
          fi
          echo "===================================================="
