name: Build and Push Container

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref, branch, or commit SHA to build'
        required: true
        default: 'dev'
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and Push to GHCR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Compute image tags
        id: meta
        run: |
          COMMIT_SHA=$(git rev-parse HEAD)
          SHORT_SHA=$(git rev-parse --short HEAD)
          IMAGE_NAME="ghcr.io/einck0/clash-sub-parser"
          TAGS="${IMAGE_NAME}:sha-${COMMIT_SHA},${IMAGE_NAME}:run-${{ github.run_id }}"
          if [ "${COMMIT_SHA}" != "${{ github.sha }}" ]; then
            TAGS="${TAGS},${IMAGE_NAME}:sha-${{ github.sha }}"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "commit_sha=${COMMIT_SHA}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "primary_tag=${IMAGE_NAME}:sha-${COMMIT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push container image
        id: build-and-push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            GOPROXY=https://proxy.golang.org,direct
            NPM_CONFIG_REGISTRY=https://registry.npmjs.org
            ALPINE_MIRROR=

      - name: Output image digest and verification summary
        run: |
          echo "===================================================="
          echo "Container build and push succeeded!"
          echo "Target ref input: ${{ inputs.ref }}"
          echo "Checked out commit SHA: ${{ steps.meta.outputs.commit_sha }}"
          echo "Short SHA: ${{ steps.meta.outputs.short_sha }}"
          echo "Primary Tag: ${{ steps.meta.outputs.primary_tag }}"
          echo "All Tags: ${{ steps.meta.outputs.tags }}"
          echo "Image Digest: ${{ steps.build-and-push.outputs.digest }}"
          echo "===================================================="
