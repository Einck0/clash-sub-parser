name: CI

'on':
  push:
    branches:
      - 'task/csp-cloud-build-integration'
      - 'cloud-build/*'
  workflow_dispatch:

jobs:
  test-and-build:
    name: Backend & Frontend Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci --include=dev

      - name: Run web type-check
        working-directory: web
        run: npm run type-check

      - name: Run web unit tests
        working-directory: web
        run: npm test

      - name: Build frontend static bundle
        working-directory: web
        run: npm run build

      - name: Copy built assets to webassets
        run: cp -r web/dist/* internal/webassets/dist/

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Verify Go dependencies
        run: go mod verify

      - name: Run Go vet
        run: go vet -tags "with_quic with_wireguard" ./...

      - name: Run Go tests
        run: go test -v -tags "with_quic with_wireguard" ./...

      - name: Build Go binary
        run: go build -tags "with_quic with_wireguard" -ldflags="-s -w" -trimpath -o bin/csp ./cmd/csp

      - name: Upload compiled binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: csp-linux-amd64
          path: bin/csp
          retention-days: 7
