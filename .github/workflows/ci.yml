name: CI & Cloud Delivery

'on':
  pull_request:
    branches:
      - dev
      - prelease
      - main
  push:
    branches:
      - dev
      - prelease
      - main
  workflow_dispatch:

permissions:
  contents: read

# Serialize same-ref runs across all jobs.
concurrency:
  group: delivery-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-and-build:
    name: Backend & Frontend Checks
    if: github.event_name != 'workflow_dispatch' || (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/prelease' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    concurrency:
      group: checks-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci --include=dev

      - name: Run web type-check
        working-directory: web
        run: npm run type-check

      - name: Run web unit tests
        working-directory: web
        run: npm test

      - name: Build frontend static bundle
        working-directory: web
        run: npm run build

      - name: Copy built assets to webassets
        run: |
          rm -rf internal/webassets/dist
          mkdir -p internal/webassets/dist
          cp -a web/dist/. internal/webassets/dist/

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Verify Go dependencies
        run: go mod verify

      - name: Run Go vet
        run: go vet -tags "with_quic with_wireguard" ./...

      - name: Install test binary dependencies (sing-box, mihomo)
        run: bash .github/scripts/install_test_binaries.sh

      - name: Set up synthetic legacy archive fixture
        run: |
          sudo mkdir -p /home/service/backups
          sudo chown -R $(id -u):$(id -g) /home/service/backups
          # Compatibility path required only by legacy tests on this fresh CI runner.
          python3 -B .github/scripts/setup_test_archive.py

      - name: Run Go tests
        run: |
          set +e
          go test -json -v -tags "with_quic with_wireguard" ./... > /tmp/go-test-output.json 2>&1
          TEST_EXIT=$?
          set -e
          python3 -B .github/scripts/annotate_go_test.py /tmp/go-test-output.json $TEST_EXIT
          exit $TEST_EXIT

      - name: Run real build-entry metadata regression (cloud only)
        run: python3 -B -m unittest discover -s tests/cloud-delivery -p 'test_build_metadata.py' -v

      - name: Build pure-static Go binary
        run: |
          mkdir -p bin
          COMMIT_EPOCH=$(git show -s --format=%ct "${{ github.sha }}")
          BUILD_TIME=$(date -u -d "@${COMMIT_EPOCH}" +"%Y-%m-%dT%H:%M:%SZ")
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -tags "with_quic with_wireguard" -ldflags="-s -w -X clash-sub-parser/internal/platform.Commit=${{ github.sha }} -X clash-sub-parser/internal/platform.BuildDate=${BUILD_TIME}" -trimpath -o bin/csp-linux-amd64 ./cmd/csp
          bin/csp-linux-amd64 --version | tee bin/build-version.txt
          grep -F "commit: ${{ github.sha }}, built: ${BUILD_TIME}" bin/build-version.txt

      - name: Validate static ELF executable
        run: |
          file bin/csp-linux-amd64
          readelf -l bin/csp-linux-amd64 > /tmp/csp-elf.txt
          if grep -qi "INTERP\|program interpreter" /tmp/csp-elf.txt; then
            echo "ERROR: Binary is dynamically linked!" >&2
            exit 1
          fi
          echo "ELF check passed: pure static binary."

      - name: Generate binary sha256 checksum manifest
        run: |
          cd bin && sha256sum csp-linux-amd64 > csp-linux-amd64.sha256
          cat csp-linux-amd64.sha256

      - name: Verify final binary artifact
        env:
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          cd bin
          sha256sum -c csp-linux-amd64.sha256
          chmod +x csp-linux-amd64
          ./csp-linux-amd64 --version | grep -F "commit: ${EXPECTED_REVISION}, built: "

      - name: Run lightweight cloud delivery contracts
        run: |
          python3 -m pip install 'PyYAML==6.0.2'
          python3 -B .github/scripts/test_ci_synthetic.py
          python3 -B -m unittest discover -s tests/cloud-delivery -p 'test_cloud_delivery.py' -v

      - name: Upload compiled binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: csp-linux-amd64
          path: |
            bin/csp-linux-amd64
            bin/csp-linux-amd64.sha256
          retention-days: 7
          if-no-files-found: error

  publish-runtime:
    name: Build & Publish Runtime Container
    needs: [test-and-build]
    runs-on: ubuntu-latest
    concurrency:
      group: runtime-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    outputs:
      image_digest: ${{ steps.check-existing.outputs.image_digest || steps.delivery.outputs.image_digest }}
    if: |
      needs.test-and-build.result == 'success' && github.event_name != 'pull_request' && (
        (github.event_name == 'push' && github.ref == 'refs/heads/dev') ||
        github.ref == 'refs/heads/prelease'
      )
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Download compiled binary artifact
        uses: actions/download-artifact@v4
        with:
          name: csp-linux-amd64
          path: bin

      - name: Verify binary sha256 checksum
        run: |
          cd bin && sha256sum -c csp-linux-amd64.sha256
          chmod +x csp-linux-amd64

      - name: Validate binary static ELF linkage
        run: |
          file bin/csp-linux-amd64
          readelf -l bin/csp-linux-amd64 > /tmp/csp-elf.txt
          if grep -qi "INTERP\|program interpreter" /tmp/csp-elf.txt; then
            echo "ERROR: Binary is not static!" >&2
            exit 1
          fi
          echo "Verified static binary."

      - name: Verify downloaded binary source revision
        env:
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          bin/csp-linux-amd64 --version | tee /tmp/csp-artifact-version.txt
          grep -F "commit: ${EXPECTED_REVISION}, built: " /tmp/csp-artifact-version.txt

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        env:
          TARGET_IMAGE_NAME: ghcr.io/einck0/clash-sub-parser
        run: |
          COMMIT_SHA="${{ github.sha }}"
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          PRIMARY_TAG="${TARGET_IMAGE_NAME}:sha-${COMMIT_SHA}"
          RUN_TAG="${TARGET_IMAGE_NAME}:run-${{ github.run_id }}"
          COMMIT_EPOCH=$(git show -s --format=%ct "${COMMIT_SHA}")
          BUILD_DATE=$(date -u -d "@${COMMIT_EPOCH}" +"%Y-%m-%dT%H:%M:%SZ")
          PUSH_TAGS=$(printf "%s\n%s" "${PRIMARY_TAG}" "${RUN_TAG}")
          if [[ "${{ github.ref }}" == "refs/heads/prelease" ]]; then
            PUSH_TAGS=$(printf "%s\n%s:prelease" "${PUSH_TAGS}" "${TARGET_IMAGE_NAME}")
          fi
          echo "commit_sha=${COMMIT_SHA}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "build_date=${BUILD_DATE}" >> "$GITHUB_OUTPUT"
          echo "primary_tag=${PRIMARY_TAG}" >> "$GITHUB_OUTPUT"
          echo "run_tag=${RUN_TAG}" >> "$GITHUB_OUTPUT"
          echo "target_image=${TARGET_IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "tag_name=sha-${COMMIT_SHA}" >> "$GITHUB_OUTPUT"
          echo "push_tags<<EOF" >> "$GITHUB_OUTPUT"
          echo "${PUSH_TAGS}" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Check existing immutable SHA image
        id: check-existing
        env:
          PRIMARY_TAG: ${{ steps.meta.outputs.primary_tag }}
          TARGET_IMAGE_NAME: ghcr.io/einck0/clash-sub-parser
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          EXPECTED_BINARY_HASH=$(awk '{print $1}' bin/csp-linux-amd64.sha256)
          echo "Checking whether immutable image tag exists: ${PRIMARY_TAG}"
          set +e
          INSPECT_OUTPUT=$(docker buildx imagetools inspect "$PRIMARY_TAG" --format '{{json .Manifest}}' 2>&1)
          INSPECT_EXIT=$?
          set -e
          if [[ $INSPECT_EXIT -eq 0 ]]; then
            EXISTING_DIGEST=$(python3 -B -c 'import json,sys; m=json.loads(sys.argv[1]); sys.exit(0 if m.get("digest") else 1)' "$INSPECT_OUTPUT" 2>/dev/null && python3 -B -c 'import json,sys; print(json.loads(sys.argv[1]).get("digest"))' "$INSPECT_OUTPUT")
            echo "Found existing tag with digest: ${EXISTING_DIGEST}"
            scripts/cloud-delivery/preflight-pull.sh \
              --image "${TARGET_IMAGE_NAME}@${EXISTING_DIGEST}" \
              --expected-revision "$EXPECTED_REVISION"
            CONTAINER_HASH=$(docker run --rm --entrypoint sha256sum "${TARGET_IMAGE_NAME}@${EXISTING_DIGEST}" /app/csp | awk '{print $1}')
            if [[ "$CONTAINER_HASH" != "$EXPECTED_BINARY_HASH" ]]; then
              echo "ERROR: Existing image binary hash (${CONTAINER_HASH}) does not match expected (${EXPECTED_BINARY_HASH})!" >&2
              exit 1
            fi
            echo "Verified existing immutable image binary checksum: ${CONTAINER_HASH}"
            if [[ "${{ github.ref }}" == "refs/heads/prelease" ]]; then
              echo "Updating rolling prelease image tag to existing digest ${EXISTING_DIGEST}"
              docker buildx imagetools create --prefer-index=false -t "${TARGET_IMAGE_NAME}:prelease" "${TARGET_IMAGE_NAME}@${EXISTING_DIGEST}"
              docker buildx imagetools inspect "${TARGET_IMAGE_NAME}:prelease" --format '{{json .Manifest}}' > /tmp/csp-alias-manifest.json
              python3 -B -c 'import json,sys; manifest=json.load(open(sys.argv[1])); sys.exit(0 if manifest.get("digest") == sys.argv[2] else "ERROR: prelease alias tag digest mismatch")' /tmp/csp-alias-manifest.json "${EXISTING_DIGEST}"
            fi
            echo "image_exists=true" >> "$GITHUB_OUTPUT"
            echo "image_digest=${EXISTING_DIGEST}" >> "$GITHUB_OUTPUT"
          else
            if echo "$INSPECT_OUTPUT" | grep -qi "not found\|404"; then
              echo "Image tag does not exist in registry; proceeding to build."
              echo "image_exists=false" >> "$GITHUB_OUTPUT"
              echo "image_digest=" >> "$GITHUB_OUTPUT"
            else
              echo "ERROR: Unexpected failure while inspecting image tag (Fail-Closed):" >&2
              echo "$INSPECT_OUTPUT" >&2
              exit 1
            fi
          fi

      - name: Build and push runtime container image
        if: steps.check-existing.outputs.image_exists != 'true'
        id: build-push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.runtime
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.push_tags }}
          build-args: |
            COMMIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ steps.meta.outputs.build_date }}
            ALPINE_MIRROR=

      - name: Verify pushed tag digest and pull immutable image
        if: steps.check-existing.outputs.image_exists != 'true'
        id: delivery
        env:
          IMAGE_DIGEST: ${{ steps.build-push.outputs.digest }}
          PRIMARY_TAG: ${{ steps.meta.outputs.primary_tag }}
          TARGET_IMAGE_NAME: ghcr.io/einck0/clash-sub-parser
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "ERROR: Missing or malformed buildx digest." >&2
            exit 1
          fi
          docker buildx imagetools inspect "$PRIMARY_TAG" --format '{{json .Manifest}}' > /tmp/csp-pushed-manifest.json
          python3 -B -c 'import json,sys; manifest=json.load(open(sys.argv[1])); sys.exit(0 if manifest.get("digest") == sys.argv[2] else "ERROR: pushed tag digest mismatch")' /tmp/csp-pushed-manifest.json "$IMAGE_DIGEST"
          if [[ "${{ github.ref }}" == "refs/heads/prelease" ]]; then
            docker buildx imagetools inspect "${TARGET_IMAGE_NAME}:prelease" --format '{{json .Manifest}}' > /tmp/csp-alias-manifest.json
            python3 -B -c 'import json,sys; manifest=json.load(open(sys.argv[1])); sys.exit(0 if manifest.get("digest") == sys.argv[2] else "ERROR: prelease alias tag digest mismatch")' /tmp/csp-alias-manifest.json "$IMAGE_DIGEST"
          fi
          scripts/cloud-delivery/preflight-pull.sh \
            --image "${TARGET_IMAGE_NAME}@${IMAGE_DIGEST}" \
            --expected-revision "$EXPECTED_REVISION"
          echo "image_digest=${IMAGE_DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Output release delivery summary
        env:
          TRIGGERED_REF: ${{ github.ref }}
          DELIVERED_DIGEST: ${{ steps.check-existing.outputs.image_digest || steps.delivery.outputs.image_digest }}
        run: |
          echo "===================================================="
          echo "CSP Cloud Runtime Container Delivery Summary"
          echo "Triggered Ref: ${TRIGGERED_REF}"
          echo "Commit SHA: ${{ steps.meta.outputs.commit_sha }}"
          echo "Image: ${{ steps.meta.outputs.target_image }}"
          echo "Primary Tag: ${{ steps.meta.outputs.primary_tag }}"
          echo "Run Tag: ${{ steps.meta.outputs.run_tag }}"
          echo "Immutable Digest: ${DELIVERED_DIGEST}"
          echo "Identity: Pushed tag digest, actual immutable pull and OCI revision verified (public access permitted)"
          echo "Notice: Container published to registry; production deployment requires explicit operator rollout."
          echo "===================================================="

  promote-prelease:
    name: Promote Tested Artifact to Prelease Channel
    needs: [test-and-build, publish-runtime]
    if: |
      needs.test-and-build.result == 'success' &&
      needs.publish-runtime.result == 'success' &&
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/prelease'
    runs-on: ubuntu-latest
    concurrency:
      group: prelease-promotion
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Download same tested binary and checksum
        uses: actions/download-artifact@v4
        with:
          name: csp-linux-amd64
          path: bin

      - name: Publish or update rolling prelease release
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_DIGEST: ${{ needs.publish-runtime.outputs.image_digest }}
        run: python3 -B .github/scripts/promote_prelease.py publish
