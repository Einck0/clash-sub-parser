proxies:
- name: HK-Shadowsocks
  type: ss
  server: hk.example.com
  port: 8388
  cipher: aes-256-gcm
  password: secret-password-1
- name: US-VMess
  type: vmess
  server: us.example.com
  port: 443
  uuid: 00000000-0000-4000-8000-000000000001
  alterId: 0
  cipher: auto
  tls: true
  network: ws
  ws-opts:
    path: /ws-path
- name: JP-VLESS-Reality
  type: vless
  server: jp.example.com
  port: 443
  uuid: 00000000-0000-4000-8000-000000000002
  tls: true
  reality-opts:
    public-key: test-pubkey-reality
    short-id: '815458e4'
  client-fingerprint: chrome
- name: SG-Trojan
  type: trojan
  server: sg.example.com
  port: 443
  password: trojan-pass-123
  sni: sg.example.com
- name: TW-Hysteria2
  type: hysteria2
  server: tw.example.com
  port: 8443
  password: hy2-password-abc
  sni: tw.example.com
  obfs: salamander
  obfs-password: obfs-pass-xyz
- name: KR-TUIC
  type: tuic
  server: kr.example.com
  port: 8443
  uuid: 00000000-0000-4000-8000-000000000003
  password: tuic-pass-456
  congestion-controller: bbr
- name: EU-WireGuard
  type: wireguard
  server: eu.example.com
  port: 51820
  ip: 10.0.0.2
  public-key: public-key-test-base64
  private-key: private-key-test-base64
proxy-groups:
- name: PROXY
  type: select
  proxies:
  - HK-Shadowsocks
  - US-VMess
  - JP-VLESS-Reality
  - SG-Trojan
  - TW-Hysteria2
  - KR-TUIC
  - EU-WireGuard
- name: AUTO
  type: url-test
  proxies:
  - HK-Shadowsocks
  - US-VMess
  url: https://cp.cloudflare.com/generate_204
  interval: 300
  tolerance: 50
rules:
- DOMAIN-SUFFIX,google.com,DIRECT
- GEOSITE,cn,DIRECT
- IP-CIDR,192.168.0.0/16,DIRECT
- MATCH,PROXY
dns:
  enable: true
  nameserver:
  - 8.8.8.8
  - 1.1.1.1
